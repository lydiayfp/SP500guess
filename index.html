<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Market Oracle Pro | 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #090b10;
            --card: #12151e;
            --text: #ffffff;
            --accent: #00ff88;
            --danger: #ff3b3b;
            --warning: #ffcc00;
            --border: #222733;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            overflow-x: hidden;
            width: 100vw;
            min-height: 100dvh;
        }

        .app-wrapper {
            padding: env(safe-area-inset-top) 16px 40px;
            max-width: 450px;
            margin: 0 auto;
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            margin-bottom: 10px;
        }
        .status-indicator {
            display: flex;
            align-items: center;
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .dot { height: 8px; width: 8px; border-radius: 50%; margin-right: 6px; }
        .dot-online { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .dot-offline { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
        
        .refresh-btn {
            background: #222733;
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        /* Ticker Cards */
        .ticker-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .t-card {
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .t-name { font-size: 9px; color: #888; font-weight: bold; margin-bottom: 4px; }
        .t-val { font-size: 14px; font-weight: 800; }

        /* Dashboard */
        .stack { display: flex; flex-direction: column; gap: 12px; }
        .card { background: var(--card); border-radius: 16px; padding: 18px; border: 1px solid var(--border); }
        .label { font-size: 10px; font-weight: 800; color: #666; text-transform: uppercase; margin-bottom: 8px; display: block; }
        
        .macro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .m-val { font-size: 1.3rem; font-weight: 800; }

        /* Sliders */
        .s-head { display: flex; justify-content: space-between; margin-bottom: 12px; align-items: center; }
        .s-tag { background: #1c212d; padding: 4px 10px; border-radius: 8px; font-weight: 900; color: var(--accent); border: 1px solid var(--border); }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px;
            background: #222733; border-radius: 10px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 24px; height: 24px;
            background: #fff; border: 3px solid var(--accent); border-radius: 50%;
        }

        /* Results */
        .res-card {
            text-align: center;
            background: linear-gradient(180deg, #161a24 0%, #090b10 100%);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        #prediction { font-size: 3.5rem; font-weight: 900; letter-spacing: -2px; margin: 10px 0; }
        #change { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; }
        .chart-box { height: 160px; }

        .log { font-size: 9px; color: #444; text-align: center; margin-top: 20px; line-height: 1.4; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <div class="status-bar">
        <div class="status-indicator">
            <div id="status-dot" class="dot dot-online"></div>
            <span id="status-text">Live Sync Active</span>
        </div>
        <button class="refresh-btn" onclick="initFetch()">REFRESH</button>
    </div>

    <div class="ticker-row">
        <div class="t-card"><p class="t-name">S&P 500</p><p class="t-val" id="sp-now">---</p></div>
        <div class="t-card"><p class="t-name">NASDAQ</p><p class="t-val" id="nd-now">---</p></div>
        <div class="t-card"><p class="t-name">DOW</p><p class="t-val" id="dw-now">---</p></div>
    </div>

    <div class="stack">
        <div class="card macro-grid">
            <div><span class="label">Latest Fed Rate</span><p class="m-val" id="fed-now">---</p></div>
            <div><span class="label">CPI Index</span><p class="m-val" id="cpi-now">---</p></div>
        </div>

        <div class="card">
            <div class="s-head"><span class="label">Fed Rate Target</span><div class="s-tag"><span id="fed-t">3.64</span>%</div></div>
            <input type="range" id="fed-in" min="0" max="10" step="0.25" value="3.64">
        </div>

        <div class="card">
            <div class="s-head"><span class="label">Inflation Target (YoY)</span><div class="s-tag"><span id="inf-t">3.30</span>%</div></div>
            <input type="range" id="inf-in" min="-2" max="12" step="0.1" value="3.30">
        </div>

        <div class="card res-card">
            <span class="label">Projected S&P 500</span>
            <div id="prediction">---</div>
            <div id="change">0.00%</div>
            <div class="chart-box"><canvas id="pChart"></canvas></div>
        </div>
    </div>

    <div class="log" id="api-log">Ready. Manual refresh enabled.</div>
</div>

<script>
    // CRITICAL: Replace these with your keys!
    const F_KEY = 'YOUR_FINNHUB_KEY';
    const A_KEY = 'YOUR_ALPHA_VANTAGE_KEY';

    let baseSP = 7365.12; 
    let baseFed = 3.64;
    let baseInf = 3.30;

    const stText = document.getElementById('status-text');
    const stDot = document.getElementById('status-dot');
    const log = document.getElementById('api-log');

    async function initFetch() {
        stText.innerText = "Syncing Data...";
        stDot.className = "dot dot-online";

        try {
            // 1. Fetch Indices (Finnhub)
            const spR = await fetch(`https://finnhub.io/api/v1/quote?symbol=^GSPC&token=${F_KEY}`);
            const ndR = await fetch(`https://finnhub.io/api/v1/quote?symbol=^IXIC&token=${F_KEY}`);
            const dwR = await fetch(`https://finnhub.io/api/v1/quote?symbol=^DJI&token=${F_KEY}`);
            
            const spD = await spR.json();
            const ndD = await ndR.json();
            const dwD = await dwR.json();

            if (!spD.c) throw new Error("Finnhub Key Invalid/Limit");
            baseSP = spD.c;
            document.getElementById('sp-now').innerText = Math.round(baseSP).toLocaleString();
            document.getElementById('nd-now').innerText = Math.round(ndD.c).toLocaleString();
            document.getElementById('dw-now').innerText = Math.round(dwD.c).toLocaleString();

            // 2. Fetch Macro (Alpha Vantage)
            const fedR = await fetch(`https://www.alphavantage.co/query?function=FEDERAL_FUNDS_RATE&interval=monthly&apikey=${A_KEY}`);
            const cpiR = await fetch(`https://www.alphavantage.co/query?function=CPI&interval=semiannual&apikey=${A_KEY}`);
            
            const fedD = await fedR.json();
            const cpiD = await cpiR.json();

            if (fedD.data) {
                baseFed = parseFloat(fedD.data[0].value);
                document.getElementById('fed-now').innerText = baseFed + "%";
                document.getElementById('fed-in').value = baseFed;
            }
            if (cpiD.data) {
                document.getElementById('cpi-now').innerText = parseFloat(cpiD.data[0].value).toFixed(2);
            }

            stText.innerText = "Live Sync Active";
            log.innerText = "Last Updated: " + new Date().toLocaleTimeString();
            runCalc();

        } catch (e) {
            console.error(e);
            stText.innerText = "OFFLINE (Limit reached)";
            stDot.className = "dot dot-offline";
            log.innerText = "Error: API Rate limit or missing key. Using cached data.";
            runCalc(); // Use fallbacks
        }
    }

    function runCalc() {
        const tFed = parseFloat(document.getElementById('fed-in').value);
        const tInf = parseFloat(document.getElementById('inf-in').value);
        document.getElementById('fed-t').innerText = tFed.toFixed(2);
        document.getElementById('inf-t').innerText = tInf.toFixed(2);

        const impact = 1 + ((tFed - baseFed) * -0.125) + ((tInf - baseInf) * -0.05);
        const res = Math.max(0, baseSP * impact);
        const diff = ((res - baseSP) / baseSP) * 100;

        document.getElementById('prediction').innerText = res.toLocaleString(undefined, {maximumFractionDigits: 2});
        const cEl = document.getElementById('change');
        cEl.innerText = (diff >= 0 ? '▲ ' : '▼ ') + diff.toFixed(2) + '%';
        cEl.style.color = diff >= 0 ? 'var(--accent)' : 'var(--danger)';
        
        updateChart(res);
    }

    // Chart
    const ctx = document.getElementById('pChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Now', 'Oracle'],
            datasets: [{
                data: [baseSP, baseSP],
                backgroundColor: ['#222733', '#00ff88'],
                borderRadius: 8
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { y: { display: false }, x: { grid: { display: false }, ticks: { color: '#444' } } }
        }
    });

    function updateChart(v) {
        myChart.data.datasets[0].data[0] = baseSP;
        myChart.data.datasets[0].data[1] = v;
        myChart.update('none');
    }

    document.getElementById('fed-in').oninput = runCalc;
    document.getElementById('inf-in').oninput = runCalc;
    window.onload = initFetch;
</script>
</body>
</html>
