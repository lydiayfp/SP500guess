<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S&P 500 Oracle</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --text: #e0e6ed;
            --accent: #00ff88;
            --danger: #ff4d4d;
            --border: #2a2f3b;
        }

        /* Prevent any horizontal scrolling or "ghosting" */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .app-container {
            width: 100%;
            max-width: 420px; /* Standard iPhone Width */
            margin: 0 auto;
            padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.8rem;
            color: #888;
        }

        /* Stack-based layout to prevent horizontal overflow */
        .stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }

        .flex-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.05rem;
        }

        .value {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Simplified, Safari-friendly Sliders */
        .slider-box {
            margin-top: 10px;
        }

        .slider-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #2a2f3b;
            border-radius: 10px;
            outline: none;
        }

        /* Fix for the "Green Blob" issue in the screenshot */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            background: white;
            border: 2px solid var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Main Output */
        .result-card {
            text-align: center;
            padding: 30px 16px;
            border: 1px solid #00ff8844;
            background: linear-gradient(180deg, #1a1f29, #151921);
        }

        #prediction {
            font-size: 2.8rem;
            font-weight: 900;
            margin: 8px 0;
            color: #fff;
        }

        #pct-change {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .chart-wrap {
            height: 140px;
            margin-bottom: 15px;
        }

        .footer-text {
            font-size: 10px;
            color: #444;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>S&P 500 Oracle</h1>
        <p class="subtitle">May 2026 Macro Predictive Model</p>
    </div>

    <div class="stack">
        <!-- Current Metrics Card -->
        <div class="card">
            <div class="flex-row">
                <div>
                    <p class="label">S&P 500 Base</p>
                    <p class="value">7,259.22</p>
                </div>
                <div style="text-align: right;">
                    <p class="label">CPI Inflation</p>
                    <p class="value">3.26%</p>
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="card">
            <div class="slider-info">
                <p class="label">Target Fed Rate</p>
                <p style="font-weight: bold;"><span id="fed-val">3.64</span>%</p>
            </div>
            <input type="range" id="fed-input" min="0" max="10" step="0.25" value="3.64">
        </div>

        <div class="card">
            <div class="slider-info">
                <p class="label">Target Inflation</p>
                <p style="font-weight: bold;"><span id="cpi-val">3.26</span>%</p>
            </div>
            <input type="range" id="cpi-input" min="-2" max="12" step="0.1" value="3.26">
        </div>

        <!-- Prediction Output -->
        <div class="card result-card">
            <p class="label">Projected Index Level</p>
            <h2 id="prediction">7,259.22</h2>
            <p id="pct-change">0.00%</p>
            
            <div class="chart-wrap">
                <canvas id="predChart"></canvas>
            </div>
            
            <p class="footer-text">
                Logic: -12.5% valuation drag per 1% rate hike. -5% drag per 1% CPI spike. Data: Fed H.15 & BLS Gazette.
            </p>
        </div>
    </div>
</div>

<script>
    const BASE_SP = 7259.22;
    const BASE_FED = 3.64;
    const BASE_CPI = 3.26;

    const fedIn = document.getElementById('fed-input');
    const cpiIn = document.getElementById('cpi-input');
    const predOut = document.getElementById('prediction');
    const pctOut = document.getElementById('pct-change');

    function update() {
        const f = parseFloat(fedIn.value);
        const c = parseFloat(cpiIn.value);

        document.getElementById('fed-val').innerText = f.toFixed(2);
        document.getElementById('cpi-val').innerText = c.toFixed(2);

        const impact = 1 + ((f - BASE_FED) * -0.125) + ((c - BASE_CPI) * -0.05);
        const res = Math.max(0, BASE_SP * impact);
        const diff = ((res - BASE_SP) / BASE_SP) * 100;

        predOut.innerText = res.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        pctOut.innerText = (diff >= 0 ? '▲ ' : '▼ ') + diff.toFixed(2) + '%';
        pctOut.style.color = diff >= 0 ? 'var(--accent)' : 'var(--danger)';
        
        myChart.data.datasets[0].data[1] = res;
        myChart.update('none');
    }

    const ctx = document.getElementById('predChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Now', 'Target'],
            datasets: [{
                data: [BASE_SP, BASE_SP],
                backgroundColor: ['#2a2f3b', '#00ff88'],
                borderRadius: 5
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { 
                y: { display: false },
                x: { ticks: { color: '#666', font: { size: 10 } }, grid: { display: false } }
            }
        }
    });

    fedIn.oninput = update;
    cpiIn.oninput = update;
    window.onload = update;
</script>

</body>
</html>
