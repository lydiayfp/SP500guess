<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>S&P 500 Market Oracle | Pro 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #090b10;
            --card: #12151e;
            --text: #ffffff;
            --accent: #00ff88;
            --danger: #ff3b3b;
            --border: #222733;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex; justify-content: center; min-height: 100dvh;
            padding: env(safe-area-inset-top) 15px 40px;
        }

        .container { width: 100%; max-width: 420px; }

        /* Status & Header */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; }
        .status-badge {
            display: flex; align-items: center; gap: 8px;
            background: #1c212d; padding: 6px 12px; border-radius: 20px;
            font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid var(--border);
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; }
        .dot.live { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
        .dot.error { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

        .refresh-btn {
            background: var(--accent); color: #000; border: none;
            padding: 10px 20px; border-radius: 12px; font-size: 11px; font-weight: 900;
            cursor: pointer; transition: transform 0.1s;
        }
        .refresh-btn:active { transform: scale(0.95); }

        /* Index Grid */
        .ticker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .ticker-card {
            background: var(--card); border: 1px solid var(--border);
            padding: 15px 10px; border-radius: 16px; text-align: center;
        }
        .t-label { font-size: 9px; color: #666; font-weight: 800; margin-bottom: 5px; }
        .t-val { font-size: 15px; font-weight: 900; letter-spacing: -0.5px; }

        /* Main Dashboard */
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .label { font-size: 10px; font-weight: 800; color: #555; text-transform: uppercase; margin-bottom: 12px; display: block; }
        
        .macro-flex { display: flex; justify-content: space-around; text-align: center; }
        .m-val { font-size: 1.5rem; font-weight: 900; }

        /* Interactive Controls */
        .slider-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .slider-box { background: #00ff8815; color: var(--accent); padding: 5px 12px; border-radius: 10px; font-weight: 900; font-size: 14px; }
        
        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 6px; background: #222733; border-radius: 10px; outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none; width: 26px; height: 26px; background: #fff; border: 4px solid var(--accent); border-radius: 50%;
        }

        /* Projected Results */
        .result-card {
            text-align: center; background: linear-gradient(180deg, #161a24 0%, #090b10 100%);
            border: 1px solid #00ff8833;
        }
        #res-price { font-size: 3.8rem; font-weight: 900; letter-spacing: -3px; margin: 10px 0; }
        #res-pct { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; }
        .chart-box { height: 180px; }

        .footer { font-size: 9px; color: #444; text-align: center; margin-top: 25px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="status-badge">
            <div id="status-dot" class="dot"></div>
            <span id="status-text">Gazette Mode</span>
        </div>
        <button class="refresh-btn" onclick="syncData()">REFRESH</button>
    </div>

    <div class="ticker-grid">
        <div class="ticker-card">
            <p class="t-label">S&P 500</p>
            <p class="t-val" id="live-sp">7,365</p>
        </div>
        <div class="ticker-card">
            <p class="t-label">NASDAQ</p>
            <p class="t-val" id="live-nd">21,440</p>
        </div>
        <div class="ticker-card">
            <p class="t-label">DOW 30</p>
            <p class="t-val" id="live-dw">44,890</p>
        </div>
    </div>

    <div class="card">
        <div class="macro-flex">
            <div><span class="label">Fed Rate</span><p class="m-val" id="base-fed">3.64%</p></div>
            <div style="width: 1px; background: #222;"></div>
            <div><span class="label">CPI Index</span><p class="m-val" id="base-cpi">330.21</p></div>
        </div>
    </div>

    <div class="card">
        <div class="slider-head">
            <span class="label">Target Fed Rate</span>
            <div class="slider-box"><span id="t-fed-val">3.64</span>%</div>
        </div>
        <input type="range" id="fed-input" min="0" max="10" step="0.25" value="3.64">
    </div>

    <div class="card">
        <div class="slider-head">
            <span class="label">Target Inflation (YoY)</span>
            <div class="slider-box"><span id="t-inf-val">3.30</span>%</div>
        </div>
        <input type="range" id="inf-input" min="-2" max="12" step="0.1" value="3.30">
    </div>

    <div class="card result-card">
        <span class="label">Projected S&P 500 Level</span>
        <div id="res-price">7,365.12</div>
        <div id="res-pct">0.00%</div>
        <div class="chart-box"><canvas id="oracleChart"></canvas></div>
    </div>

    <div class="footer" id="log">
        Data Sync: Manual Refresh Required. <br>
        Baseline: May 2026 Fed Reserve H.15 & BLS Gazette.
    </div>
</div>

<script>
    // API CONFIG - Use TwelveData for better CORS handling
    const API_KEY = 'YOUR_TWELVE_DATA_KEY'; 

    // FALLBACKS (May 2026)
    let curSP = 7365.12;
    let curFed = 3.64;
    let curInf = 3.30;
    let curCPI = 330.21;

    async function syncData() {
        const btn = document.querySelector('.refresh-btn');
        const dot = document.getElementById('status-dot');
        const st = document.getElementById('status-text');
        
        btn.innerText = "SYNCING...";
        dot.className = "dot live";

        try {
            // Fetch S&P 500 (GSPC)
            const resp = await fetch(`https://api.twelvedata.com/quote?symbol=SPX,IXIC,DJI&apikey=${API_KEY}`);
            const data = await resp.json();

            if (data.SPX && data.SPX.close) {
                curSP = parseFloat(data.SPX.close);
                document.getElementById('live-sp').innerText = Math.round(curSP).toLocaleString();
                document.getElementById('live-nd').innerText = Math.round(data.IXIC.close).toLocaleString();
                document.getElementById('live-dw').innerText = Math.round(data.DJI.close).toLocaleString();
                
                st.innerText = "LIVE DATA SYNCED";
                document.getElementById('log').innerText = "Last update: " + new Date().toLocaleTimeString();
            } else {
                throw new Error("No Data");
            }
        } catch (e) {
            console.warn("API Offline or No Key. Using Gazetted Fallbacks.");
            st.innerText = "GAZETTE MODE (OFFLINE)";
            dot.className = "dot error";
            document.getElementById('log').innerText = "API Limit reached. Using May 2026 Baseline data.";
        } finally {
            btn.innerText = "REFRESH";
            updateUI();
        }
    }

    function updateUI() {
        document.getElementById('base-fed').innerText = curFed + "%";
        document.getElementById('base-cpi').innerText = curCPI.toFixed(2);
        calculate();
    }

    function calculate() {
        const tFed = parseFloat(document.getElementById('fed-input').value);
        const tInf = parseFloat(document.getElementById('inf-input').value);

        document.getElementById('t-fed-val').innerText = tFed.toFixed(2);
        document.getElementById('t-inf-val').innerText = tInf.toFixed(2);

        // Model Logic: Valuation Compression
        // Impact = 1 + (Rate Delta * -12.5%) + (Inflation Delta * -5%)
        const impact = 1 + ((tFed - curFed) * -0.125) + ((tInf - curInf) * -0.05);
        const prediction = Math.max(0, curSP * impact);
        const diff = ((prediction - curSP) / curSP) * 100;

        document.getElementById('res-price').innerText = prediction.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
        const pctEl = document.getElementById('res-pct');
        pctEl.innerText = (diff >= 0 ? '▲ ' : '▼ ') + diff.toFixed(2) + '%';
        pctEl.style.color = diff >= 0 ? 'var(--accent)' : 'var(--danger)';

        updateChart(prediction);
    }

    // Charting Engine
    const ctx = document.getElementById('oracleChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Current', 'Oracle'],
            datasets: [{
                data: [curSP, curSP],
                backgroundColor: ['#222733', '#00ff88'],
                borderRadius: 12,
                barThickness: 50
            }]
        },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: { 
                y: { display: false }, 
                x: { grid: { display: false }, ticks: { color: '#555', font: { weight: 'bold' } } } 
            }
        }
    });

    function updateChart(val) {
        myChart.data.datasets[0].data[0] = curSP;
        myChart.data.datasets[0].data[1] = val;
        myChart.update('none');
    }

    document.getElementById('fed-input').oninput = calculate;
    document.getElementById('inf-input').oninput = calculate;
    
    // Initial Load
    window.onload = syncData;
</script>

</body>
</html>
